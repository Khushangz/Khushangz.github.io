<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catan Turn Timer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&display=swap" rel="stylesheet">
<style>
:root{
  --felt:#1f3a2e; --felt-deep:#14271f; --wood:#b8894a; --wheat:#e8c56a; --brick:#c8553d;
  --ore:#8d96a3; --sheep:#9ccf7c; --ink:#f4efe3; --ink-dim:#b7b1a3; --tile:#274a3b; --tile-edge:#36624f;
  --neg:#ff5c4d; --bg:var(--felt);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:var(--felt-deep); --tile:#1e3a2e; --tile-edge:#2f5644; } }
:root[data-theme="dark"]{ --bg:var(--felt-deep); --tile:#1e3a2e; --tile-edge:#2f5644; }
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;
  background-image:radial-gradient(circle at 50% 0%,rgba(232,197,106,.10),transparent 55%);min-height:100vh;padding:1.25rem;}
h1{font-size:clamp(1.6rem,4vw,2.4rem);font-weight:700;margin:0 0 .25rem;letter-spacing:-.02em}
.sub{color:var(--ink-dim);margin:0 0 1.5rem;font-size:.95rem}
.wrap{max-width:900px;margin:0 auto}
label{display:block;font-size:.85rem;color:var(--ink-dim);margin-bottom:.3rem}
input[type=number],input[type=text]{width:100%;background:rgba(0,0,0,.25);border:1px solid var(--tile-edge);color:var(--ink);
  border-radius:8px;padding:.6rem .7rem;font:inherit;font-size:1rem}
input:focus-visible,button:focus-visible{outline:2px solid var(--wheat);outline-offset:2px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:1rem;margin-bottom:1.25rem}
.players{display:grid;gap:.75rem;margin-bottom:1.5rem}
.prow{display:grid;grid-template-columns:32px 1fr 120px;gap:.75rem;align-items:end;background:var(--tile);
  border:1px solid var(--tile-edge);border-radius:12px;padding:.75rem}
.swatch{width:28px;height:32px;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);margin-bottom:.35rem}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:.8rem 1.2rem;font-weight:600;font-size:1rem}
.primary{background:var(--wheat);color:#2b2410}
.ghost{background:transparent;color:var(--ink);border:1px solid var(--tile-edge)}
.danger{background:transparent;color:var(--neg);border:1px solid var(--neg)}
.actions{display:flex;flex-wrap:wrap;gap:.75rem;align-items:center}
.hidden{display:none !important}

/* game */
.board{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.75rem;margin-bottom:1.25rem}
.tile{position:relative;background:var(--tile);border:2px solid var(--tile-edge);border-radius:14px;padding:.9rem .9rem .8rem;
  transition:transform .15s,border-color .15s;cursor:pointer;text-align:left;color:inherit;font:inherit}
.tile.active{border-color:var(--wheat);transform:translateY(-3px);box-shadow:0 0 0 4px rgba(232,197,106,.18)}
.tile .name{font-size:.95rem;color:var(--ink-dim);display:flex;align-items:center;gap:.4rem;margin-bottom:.25rem}
.tile .dot{width:10px;height:12px;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);flex:none}
.tile .t{font-size:clamp(1.6rem,4.5vw,2.2rem);font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.tile.neg .t{color:var(--neg)}
.tile.neg{border-color:rgba(255,92,77,.6)}
.tile.active.neg{border-color:var(--neg);box-shadow:0 0 0 4px rgba(255,92,77,.2)}

.big{text-align:center;padding:2rem 1rem 1.5rem}
.big .who{font-size:1.1rem;color:var(--ink-dim)}
.big .clock{font-size:clamp(4rem,18vw,9rem);font-weight:800;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.04em;margin:.25rem 0}
.big.neg .clock{color:var(--neg)}
.big .hint{color:var(--ink-dim);font-size:.85rem}
.controls{display:flex;flex-wrap:wrap;gap:.75rem;justify-content:center;margin-bottom:1rem}
.controls .primary{padding:1rem 2.2rem;font-size:1.15rem}
.stat{color:var(--ink-dim);font-size:.85rem;text-align:center}
@media (prefers-reduced-motion: reduce){ .tile{transition:none} }
</style>
</head>
<body>
<div class="wrap">

<section id="setup">
  <h1>Catan turn timer</h1>
  <p class="sub">Each player starts with a bank of time. Every time a turn comes back to you, you get a bonus. Run out and the clock keeps going into the red.</p>

  <div class="row">
    <div><label for="nPlayers">Players</label><input id="nPlayers" type="number" min="2" max="8" value="4"></div>
    <div><label for="inc">Bonus per turn (seconds)</label><input id="inc" type="number" min="0" value="30"></div>
    <div><label for="defMin">Default starting time (minutes)</label><input id="defMin" type="number" min="0" value="10"></div>
  </div>

  <div class="players" id="playerList"></div>

  <div class="actions">
    <button class="primary" id="startBtn">Start game</button>
    <button class="ghost" id="applyDefault">Apply default time to all</button>
  </div>
</section>

<section id="game" class="hidden">
  <div class="big" id="big">
    <div class="who" id="bigWho"></div>
    <div class="clock" id="bigClock">10:00</div>
    <div class="hint">Space or Enter ends the turn · click a tile to jump to that player</div>
  </div>
  <div class="controls">
    <button class="primary" id="endTurn">End turn</button>
    <button class="ghost" id="pause">Pause</button>
    <button class="danger" id="reset">New game</button>
  </div>
  <div class="board" id="board"></div>
  <div class="stat" id="stat"></div>
</section>

</div>

<script>
(function(){
  const COLORS=['#c8553d','#e8c56a','#9ccf7c','#8d96a3','#6aa7d8','#d98cc9','#f0a35e','#e5e5e5'];
  const $=id=>document.getElementById(id);
  const nPlayers=$('nPlayers'),inc=$('inc'),defMin=$('defMin'),playerList=$('playerList');

  let saved=null;
  try{ saved=JSON.parse(localStorage.getItem('catan-timer-setup')||'null'); }catch(e){}
  if(saved){ nPlayers.value=saved.n; inc.value=saved.inc; defMin.value=saved.def; }

  function renderSetup(){
    const n=Math.max(2,Math.min(8,+nPlayers.value||4));
    const prev=[...playerList.querySelectorAll('.prow')].map(r=>({name:r.querySelector('.pname').value,min:r.querySelector('.pmin').value}));
    playerList.innerHTML='';
    for(let i=0;i<n;i++){
      const s=(saved&&saved.players&&saved.players[i])||{};
      const p=prev[i]||{name:s.name||('Player '+(i+1)),min:s.min||defMin.value};
      const row=document.createElement('div');row.className='prow';
      row.innerHTML=`<div class="swatch" style="background:${COLORS[i]}"></div>
        <div><label>Name</label><input class="pname" type="text" value="${p.name.replace(/"/g,'&quot;')}"></div>
        <div><label>Start (min)</label><input class="pmin" type="number" min="0" step="0.5" value="${p.min}"></div>`;
      playerList.appendChild(row);
    }
    saved=null;
  }
  nPlayers.addEventListener('change',renderSetup);
  $('applyDefault').addEventListener('click',()=>playerList.querySelectorAll('.pmin').forEach(i=>i.value=defMin.value));
  renderSetup();

  // ---- game state
  let players=[],cur=0,running=false,last=0,raf=null,turns=0,incMs=30000;

  function fmt(ms){
    const neg=ms<0; ms=Math.abs(ms);
    const s=Math.floor(ms/1000),m=Math.floor(s/60),sec=s%60;
    return (neg?'−':'')+m+':'+String(sec).padStart(2,'0');
  }

  function renderBoard(){
    const b=$('board');b.innerHTML='';
    players.forEach((p,i)=>{
      const t=document.createElement('button');t.className='tile';t.dataset.i=i;
      t.innerHTML=`<div class="name"><span class="dot" style="background:${p.color}"></span>${p.name}</div><div class="t"></div>`;
      t.addEventListener('click',()=>jumpTo(i));
      b.appendChild(t);
    });
  }

  function paint(){
    const tiles=$('board').children;
    players.forEach((p,i)=>{
      const t=tiles[i]; t.querySelector('.t').textContent=fmt(p.ms);
      t.classList.toggle('active',i===cur); t.classList.toggle('neg',p.ms<0);
    });
    const p=players[cur];
    $('bigWho').textContent=p.name+(running?'':' (paused)');
    $('bigClock').textContent=fmt(p.ms);
    $('big').classList.toggle('neg',p.ms<0);
    $('stat').textContent='Turn '+turns+' · +'+(incMs/1000)+'s each turn';
  }

  function tick(now){
    if(running){ players[cur].ms-=now-last; }
    last=now; paint(); raf=requestAnimationFrame(tick);
  }

  function jumpTo(i){ if(i===cur)return; cur=i; players[cur].ms+=incMs; turns++; paint(); }
  function endTurn(){ jumpTo((cur+1)%players.length); }

  $('startBtn').addEventListener('click',()=>{
    incMs=Math.max(0,+inc.value||0)*1000;
    players=[...playerList.querySelectorAll('.prow')].map((r,i)=>({
      name:r.querySelector('.pname').value.trim()||('Player '+(i+1)),
      ms:Math.max(0,+r.querySelector('.pmin').value||0)*60000,color:COLORS[i]}));
    try{ localStorage.setItem('catan-timer-setup',JSON.stringify({n:players.length,inc:inc.value,def:defMin.value,
      players:players.map(p=>({name:p.name,min:p.ms/60000}))})); }catch(e){}
    cur=0;turns=1;running=true;
    $('setup').classList.add('hidden');$('game').classList.remove('hidden');
    renderBoard();paint();
    last=performance.now(); if(raf)cancelAnimationFrame(raf); raf=requestAnimationFrame(tick);
  });

  $('endTurn').addEventListener('click',endTurn);
  $('pause').addEventListener('click',()=>{ running=!running; $('pause').textContent=running?'Pause':'Resume'; paint(); });
  $('reset').addEventListener('click',()=>{
    if(!confirm('Start a new game? Current clocks will be lost.'))return;
    running=false; if(raf)cancelAnimationFrame(raf); raf=null;
    $('pause').textContent='Pause';
    $('game').classList.add('hidden');$('setup').classList.remove('hidden');
  });
  document.addEventListener('keydown',e=>{
    if($('game').classList.contains('hidden'))return;
    if(e.target.tagName==='INPUT')return;
    if(e.code==='Space'||e.code==='Enter'){e.preventDefault();endTurn();}
    if(e.key==='p'||e.key==='P'){$('pause').click();}
  });
})();
</script>
</body>
</html>
